server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: school-attendance-anti-fraud
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    show-sql: false

# Anti-Fraud & Security Policy Defaults
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  anti-fraud:
    qr-rotation-seconds: ${ANTI_FRAUD_QR_ROTATION_SECONDS:15}
    six-digit-expiration-seconds: ${ANTI_FRAUD_SIX_DIGIT_EXPIRATION_SECONDS:30}
    six-digit-max-failed-attempts: 5
    six-digit-lockout-minutes: 10
    gps-default-radius-meters: ${ANTI_FRAUD_GPS_RADIUS_METERS:150}
    gps-school-latitude: ${SCHOOL_LATITUDE:32.0575}
    gps-school-longitude: ${SCHOOL_LONGITUDE:35.8890}
    gps-max-accuracy-meters: 80
    manual-verification-period-days: ${ANTI_FRAUD_INITIAL_MANUAL_PERIOD_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
