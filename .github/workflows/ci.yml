name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend (Spring Boot 3 + Java 21 LTS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Automated Unit and Integration Tests
        run: |
          cd backend
          mvn clean test -B

      - name: Package JAR
        run: |
          cd backend
          mvn package -DskipTests -B

  frontend-test-and-build:
    name: Frontend (React 18 + Vite + TypeScript PWA)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check and Vite Production Build
        run: |
          cd frontend
          npm run build
